<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Open Me! ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pink: #ff85a1;
            --soft-pink: #ffe5ec;
            --dark-pink: #ff4d6d;
            --button-blue: #3a86ff;
            --dead-gray: #adb5bd;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

        body {
            background-color: var(--soft-pink);
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Fredoka', sans-serif; 
            overflow: hidden; position: fixed;
        }

        .bg-heart {
            position: absolute; color: var(--pink); opacity: 0.3;
            animation: float 5s infinite linear; z-index: 1; pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(110vh); }
            100% { transform: translateY(-10vh); }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px; border-radius: 35px;
            box-shadow: 0 15px 30px rgba(255, 77, 109, 0.2);
            text-align: center; z-index: 99;
            width: 90%; max-width: 400px;
            border: 5px dashed var(--pink);
            position: relative;
        }

        .extravaganza {
            width: 95% !important;
            max-width: 450px !important;
            animation: pulseCard 1s infinite alternate, glow 2s infinite;
        }

        .success-photo-wrapper {
            position: relative;
            width: 100%; border-radius: 25px;
            overflow: hidden; border: 6px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .success-photo-wrapper img { width: 100%; height: auto; display: block; }

        .overlay-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            color: white; font-weight: 700; font-size: 1.6rem;
            background: linear-gradient(transparent, rgba(255, 77, 109, 0.8));
            padding: 30px 10px 15px 10px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            pointer-events: none; animation: textPulse 1.5s infinite ease-in-out; z-index: 100;
        }

        @keyframes textPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
        @keyframes pulseCard { from { transform: scale(1); } to { transform: scale(1.03); } }
        @keyframes glow { 0% { box-shadow: 0 0 20px #ff4d6d; } 50% { box-shadow: 0 0 40px #ff85a1, 0 0 60px #ff4d6d; } 100% { box-shadow: 0 0 20px #ff4d6d; } }

        .photo-container {
            width: 100%; height: 230px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 10px;
        }

        .photo-container img {
            max-width: 100%; max-height: 100%;
            border-radius: 20px; border: 4px solid white; object-fit: contain;
        }

        h1 { color: var(--dark-pink); font-size: 2.2rem; margin: 10px 0; font-weight: 700; }
        .buttons { display: flex; flex-direction: column; gap: 12px; }
        
        button {
            padding: 16px; font-size: 1.6rem; border: none;
            border-radius: 50px; cursor: pointer;
            font-family: 'Fredoka', sans-serif; font-weight: 600;
            width: 100%; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
        }

        #yesBtn { background-color: var(--dark-pink); color: white; }
        #noBtn { background-color: var(--button-blue); color: white; }
        .dead { background-color: var(--dead-gray) !important; color: #ffffff !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="main-card" class="container">
        <div class="photo-container">
            <img id="main-media" src="IMG_8452.jpg">
        </div>
        <h1 id="main-question">Will you be my Valentine?</h1>
        <div class="buttons">
            <button id="yesBtn" type="button">Yes</button>
            <button id="noBtn" type="button">Yeah nah</button>
        </div>
    </div>

    <div id="success-card" class="container hidden">
        <div class="success-photo-wrapper">
            <img src="IMG_3562.jpg">
            <div class="overlay-text">I KNEW YOU WOULD SAY YES!</div>
        </div>
        <h1 style="margin-top: 20px; font-size: 2.8rem; color: #ff4d6d;">FINALLY! 🥰</h1>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const mainMedia = document.getElementById('main-media');
            const mainCard = document.getElementById('main-card');
            const successCard = document.getElementById('success-card');

            const pages = [
                { yes: "Yes!!", no: "Even after I got you your ball holder?", img: "b.JPG" },
                { yes: "Why aren't you clicking yes??", no: "Are you actually fr?", img: "kl.JPG" },
                { yes: "Yes", no: "I'm gonna be so sad...", img: "ss.JPG" },
                { yes: "YES", no: "Look how big the yes button is!", img: "a.JPG" },
                { yes: "Of course yes", no: "You're breaking my heart!", img: "thumb.JPG" },
                { yes: "Omg yes", no: "You're just being mean now", img: "s.JPG" }
            ];

            // --- PRELOAD SCRIPT START ---
            const allImages = ["b.JPG", "kl.JPG", "ss.JPG", "a.JPG", "thumb.JPG", "s.JPG", "ah.JPG", "IMG_3562.jpg"];
            allImages.forEach((src) => {
                const img = new Image();
                img.src = src;
            });
            // --- PRELOAD SCRIPT END ---

            let currentStep = 0;
            let finalMode = false;

            function fireConfetti() {
                const duration = 15 * 1000;
                const animationEnd = Date.now() + duration;
                const interval = setInterval(function() {
                    const timeLeft = animationEnd - Date.now();
                    if (timeLeft <= 0) return clearInterval(interval);
                    confetti({ particleCount: 45, spread: 360, origin: { x: Math.random(), y: Math.random() - 0.2 }, colors: ['#ff4d6d', '#ff85a1', '#ffffff', '#3a86ff'] });
                }, 250);
            }

            yesBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (finalMode) {
                    mainCard.classList.add('hidden');
                    successCard.classList.remove('hidden');
                    successCard.classList.add('extravaganza');
                    fireConfetti();
                } else {
                    yesBtn.classList.add('dead');
                }
            });

            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                yesBtn.classList.remove('dead');
                if (currentStep < pages.length) {
                    const p = pages[currentStep];
                    yesBtn.innerText = p.yes;
                    noBtn.innerText = p.no;
                    mainMedia.src = p.img;

                    if (p.img === "a.JPG") {
                        yesBtn.style.fontSize = "3.5rem";
                        yesBtn.style.padding = "30px";
                        noBtn.style.fontSize = "1rem";
                        noBtn.style.padding = "8px";
                    } else {
                        let currentF = parseFloat(window.getComputedStyle(yesBtn).fontSize);
                        if (currentF < 60) yesBtn.style.fontSize = (currentF + 5) + "px";
                        noBtn.style.fontSize = "1.5rem";
                        noBtn.style.padding = "16px";
                    }
                    currentStep++;
                } else {
                    noBtn.classList.add('hidden');
                    yesBtn.innerText = "OKAY YES FOR REAL! ❤️";
                    yesBtn.style.backgroundColor = "#28a745";
                    yesBtn.style.fontSize = "2.1rem";
                    yesBtn.style.padding = "20px";
                    mainMedia.src = "ah.JPG";
                    finalMode = true;
                }
            });

            for (let i = 0; i < 12; i++) {
                let h = document.createElement('div');
                h.className = 'bg-heart'; h.innerHTML = '❤️';
                h.style.left = Math.random() * 100 + 'vw';
                h.style.top = '-20px'; h.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(h);
            }
        });
    </script>
</body>
</html>
